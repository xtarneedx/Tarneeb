<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122e29"><meta name="description" content="حسبة الطرنيب: اختار الطلب وسجل النتيجة بضغطة، للاعبين أو أكثر."><title>حسبة الطرنيب</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#183c33;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #d4a64b;outline-offset:4px}header{background:#122e29;color:#fff;padding:30px max(22px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:14px}.logo{font:38px Georgia;color:#ddbb72}h1{font-size:24px;margin:0 0 7px}header p{margin:0;color:#adc2b8;font-size:12px}.tag{border:1px solid #496158;border-radius:30px;padding:9px 12px;font-size:12px;color:#d8c69f}main{max-width:1100px;margin:auto;padding:34px 20px}h2{font-size:20px;margin:0}.intro{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.intro p{font-size:13px;color:#768078;margin:9px 0 0}.plain{border:1px solid #d6dcd4;background:transparent;color:#345749;border-radius:12px;padding:12px 16px}.add{background:#193e34;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#fff;border:1px solid #e0e5dc;border-radius:22px;padding:22px;box-shadow:0 7px 20px #183c3305}.top{display:flex;gap:10px;align-items:center}.avatar{background:#f0f2e9;color:#78815d;border-radius:12px;width:38px;height:38px;display:grid;place-items:center}.name{min-width:0;width:100%;border:0;background:none;color:#234638;font-weight:bold;font-size:17px;padding:8px 0}.remove{border:0;background:none;color:#8a948b;font-size:22px;padding:4px 8px}.score{font-family:Arial,sans-serif;font-weight:700;font-size:76px;letter-spacing:-3px;text-align:center;line-height:1.2;margin:24px 0 0;direction:ltr}.negative{color:#b54c4d}.score-label{text-align:center;font-size:12px;color:#889088;margin-bottom:25px}.request{background:#f6f7f2;border-radius:15px;padding:13px 14px;margin-bottom:14px}.request-label{font-size:12px;color:#6c786d;text-align:center;margin-bottom:9px}.stepper{display:flex;align-items:center;justify-content:space-between;direction:ltr}.step{width:43px;height:40px;border:1px solid #dce1d6;border-radius:10px;background:white;color:#355445;font-size:25px}.bid{font:700 28px Arial}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border:0;border-radius:12px;padding:16px 4px;font-weight:bold;font-size:15px}.win{background:#267f58;color:#fff}.lose{background:#fae9e6;color:#b64040}.actions small{font:12px Arial;display:block;margin-top:7px;opacity:.8}.tools{display:flex;justify-content:space-between;gap:12px;margin:24px 0 30px}.history{border-top:1px solid #dce1d7;padding-top:24px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.count{color:#7a847a;font-size:12px}.empty{text-align:center;color:#859084;padding:24px;font-size:14px}.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #e2e6dd;font-size:13px}.row b{margin-right:auto;direction:ltr;font-family:Arial;font-size:19px}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e0eee3;color:#27794e}.dot.bad{background:#f8e2de;color:#b64040}.note{text-align:center;color:#849083;font-size:12px;margin:28px 0 0}#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#193e34;color:white;padding:13px 22px;border-radius:15px;box-shadow:0 5px 25px #0002;z-index:5;max-width:90%;width:max-content}#status:empty{display:none}@media(max-width:600px){header{padding:22px 20px}.tag{display:none}main{padding-top:24px}.grid{grid-template-columns:1fr}.intro{align-items:start}h2{font-size:18px}.intro p{max-width:210px;line-height:1.8}.card{padding:20px}.score{margin-top:14px;font-size:66px}.score-label{margin-bottom:18px}.tools button{font-size:12px}.note{line-height:1.8}}
</style></head><body><header><div class="brand"><span class="logo">♠</span><div><h1>حسبة الطرنيب</h1><p>عليكم اللعب، وعلينا الحسبة.</p></div></div><span class="tag">♣ &nbsp; لمّة حلوة، وحسبة سهلة</span></header><main><section class="intro"><div><h2>طاولة اللعب</h2><p>حدّد الطلب، واضغط أخضر لو جابه أو أحمر لو ما جابش.</p></div><button class="plain add" id="add">＋ إضافة لاعب</button></section><div id="players" class="grid"></div><div class="tools"><button class="plain" id="undo">↶ تراجع عن آخر نتيجة</button><button class="plain" id="reset">بدء لعبة جديدة</button></div><section class="history"><div class="history-head"><h2>سجل النتائج</h2><span id="count" class="count"></span></div><div id="history"></div></section><p class="note" id="save-note">تُحفظ النتيجة تلقائيًا على هذا الجهاز • تُحسب قيمة الطلب فقط</p></main><div id="status" role="status" aria-live="polite"></div><script>
const KEY='tarneeb-score-v1';let seq=Date.now();const player=n=>({id:++seq,name:'اللاعب '+n,score:0,bid:7});let state={players:[player(1),player(2)],history:[]};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.players)&&x.players.length>=2&&Array.isArray(x.history)&&x.players.every(p=>typeof p.name==='string'&&Number.isFinite(p.score)&&Number.isInteger(p.bid)&&p.bid>=1&&p.bid<=13))state=x}catch{}const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;function toast(t){$('status').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('status').textContent='',2400)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{$('save-note').textContent='الحفظ غير متاح في هذا المتصفح؛ خليك فاتح الصفحة للحفاظ على النتيجة.'}}function render(){ $('players').innerHTML=state.players.map((p,i)=>`<article class="card" data-id="${p.id}"><div class="top"><span class="avatar">${['♠','♥','♣','♦'][i%4]}</span><input class="name" maxlength="30" aria-label="اسم اللاعب ${i+1}" value="${esc(p.name)}"><button class="remove" data-action="remove" aria-label="حذف ${esc(p.name)}" ${state.players.length<=2?'disabled':''}>×</button></div><div class="score ${p.score<0?'negative':''}" aria-live="polite">${p.score}</div><div class="score-label">مجموع النقاط</div><div class="request"><div class="request-label">قيمة الطلب</div><div class="stepper"><button class="step" data-action="minus" aria-label="تقليل الطلب" ${p.bid===1?'disabled':''}>−</button><span class="bid">${p.bid}</span><button class="step" data-action="plus" aria-label="زيادة الطلب" ${p.bid===13?'disabled':''}>+</button></div></div><div class="actions"><button class="result win" data-action="win">✓ جابها<small>+${p.bid}</small></button><button class="result lose" data-action="lose">✕ ما جابهاش<small>−${p.bid}</small></button></div></article>`).join('');$('undo').disabled=!state.history.length;$('count').textContent=state.history.length+' نتيجة';$('history').innerHTML=state.history.length?state.history.slice().reverse().map(h=>`<div class="row"><span class="dot ${h.delta<0?'bad':''}">${h.delta>0?'✓':'✕'}</span><span>${esc(h.name)} · ${h.delta>0?'جابها':'ما جابهاش'}</span><b class="${h.delta<0?'negative':''}">${h.delta>0?'+':''}${h.delta}</b></div>`).join(''):'<div class="empty">اللمّة بدأت؟ سجّل أول نتيجة وتلقاها هنا.</div>'}
$('players').addEventListener('change',e=>{if(e.target.matches('.name')){const p=state.players.find(p=>p.id===Number(e.target.closest('.card').dataset.id));p.name=e.target.value.trim()||'لاعب';e.target.value=p.name;save()}});$('players').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const p=state.players.find(p=>p.id===Number(b.closest('.card').dataset.id));const a=b.dataset.action;if(a==='plus')p.bid=Math.min(13,p.bid+1);if(a==='minus')p.bid=Math.max(1,p.bid-1);if(a==='remove'){if(state.players.length<=2)return;if(!confirm('حذف '+p.name+'؟ سيتم حذف نتائجه من السجل.'))return;state.players=state.players.filter(v=>v.id!==p.id);state.history=state.history.filter(h=>h.id!==p.id)}if(a==='win'||a==='lose'){const delta=a==='win'?p.bid:-p.bid;p.score+=delta;state.history.push({id:p.id,name:p.name,delta});toast(p.name+': '+(delta>0?'+':'')+delta+' نقطة')}save();render()});$('add').onclick=()=>{state.players.push(player(state.players.length+1));save();render();const last=$('players').lastElementChild;last.scrollIntoView({behavior:'smooth',block:'center'});last.querySelector('input').focus()};$('undo').onclick=()=>{const h=state.history.pop();if(!h)return;const p=state.players.find(p=>p.id===h.id);if(p)p.score-=h.delta;save();render();toast('تم التراجع عن آخر نتيجة')};$('reset').onclick=()=>{if(!confirm('تصفير النقاط وسجل النتائج وبدء لعبة جديدة؟'))return;state.players.forEach(p=>{p.score=0;p.bid=7});state.history=[];save();render();toast('لعبة جديدة، بالتوفيق!')};render();
</script></body></html>
